[pytest]
testpaths = tests
asyncio_mode = auto
# The real-model test is slow and needs the model download: run it with `pytest -m slow`.
markers =
    slow: needs the real sentence-transformers model (skipped by default)
    llm_live: calls the real LLM provider with LLM_API_KEY (opt-in: pytest -m llm_live; never by default)
addopts = -m "not slow and not llm_live"
